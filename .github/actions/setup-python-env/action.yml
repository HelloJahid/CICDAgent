# Reusable composite action: set up Python and install dev dependencies.
# Used by the lint and test jobs in both ci.yaml and cd.yaml so the setup lives
# in one place. The repo must already be checked out before calling this.

name: Setup Python env
description: Set up Python 3.12 with pip caching and install the dev dependencies.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev dependencies
      shell: bash
      run: pip install -r requirements-dev.txt
