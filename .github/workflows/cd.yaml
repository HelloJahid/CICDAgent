# Continuous Deployment: build once, then promote through environments.
#
# On a push to main: lint + test, build & push a SHA-tagged image to ECR, then
# deploy to STAGING automatically and verify it. Deploying to PRODUCTION is
# gated behind a manual approval - the `production` GitHub Environment has a
# required reviewer - so a human decides when a change goes live.

name: CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/cd.yaml"
  workflow_dispatch: {}

# id-token: write is required for keyless OIDC auth to AWS.
permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: pytest

  build-push:
    name: Build and push image
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Expose the exact image URI so both deploy jobs ship the very same image.
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute the image URI
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (Docker v2 manifest for Lambda)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          provenance: false
          sbom: false
          # Reuse unchanged layers (e.g. the pip-install layer) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Auto-deploys to staging and verifies it. Tied to the `staging` environment.
  deploy-staging:
    name: Deploy to staging
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy image to the staging Lambda
        run: |
          aws lambda update-function-code \
            --function-name route-demand-assistant-staging \
            --image-uri ${{ needs.build-push.outputs.image }}
          aws lambda wait function-updated --function-name route-demand-assistant-staging

      - name: Smoke test staging
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name route-demand-assistant-staging \
            --query FunctionUrl --output text)
          echo "Pinging ${URL}ping"
          curl --fail --show-error --retry 5 --retry-delay 3 --retry-connrefused "${URL}ping"

  # Deploys the SAME image to production - but only after manual approval, because
  # the `production` environment has a required reviewer. needs build-push too so
  # it can read the image URI output.
  deploy-production:
    name: Deploy to production
    needs: [build-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy image to the production Lambda
        run: |
          aws lambda update-function-code \
            --function-name route-demand-assistant \
            --image-uri ${{ needs.build-push.outputs.image }}
          aws lambda wait function-updated --function-name route-demand-assistant

      - name: Smoke test production
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name route-demand-assistant \
            --query FunctionUrl --output text)
          echo "Pinging ${URL}ping"
          curl --fail --show-error --retry 5 --retry-delay 3 --retry-connrefused "${URL}ping"

  # Failure notification: runs only if any job above failed, and posts an alert
  # to Slack via a plain curl to the webhook (kept as a secret, not a variable).
  # No third-party action, so no extra supply-chain surface.
  notify-failure:
    name: Notify on failure
    needs: [lint, test, build-push, deploy-staging, deploy-production]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure alert to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.JAHID_SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: CD failed for *${{ github.repository }}* on commit \`${{ github.sha }}\`\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
