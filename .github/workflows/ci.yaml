# Continuous Integration: the front half of the pipeline.
#
# On every pull request to main (and on a manual run), this verifies a change in
# three ways before it can be merged: style (lint), behaviour (test), and
# packaging (build). lint and test run in parallel; build only runs if both pass.

name: CI

on:
  pull_request:
    branches: [main]
    # Path filters: only run when something that affects the app changes.
    # A README-only change should not trigger a full CI run.
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

# Least privilege: the automatic workflow token only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python and install deps
        uses: ./.github/actions/setup-python-env

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python and install deps
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: pytest

  # Gated on lint AND test passing. Builds the image to prove it compiles, but
  # does not push it anywhere - pushing to ECR is a CD concern (Phase 5).
  build:
    name: Build image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: route-demand-assistant:ci-${{ github.sha }}
